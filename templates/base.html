<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EduHub - Chia sẻ tài liệu học tập{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'document_list' %}">EduHub</a>
            <div class="d-flex ms-auto">
                {% if user.is_authenticated %}
                    <a class="btn btn-outline-light me-2" href="{% url 'document_upload' %}">Đăng tài liệu</a>
                    <form method="post" action="{% url 'logout' %}" class="d-inline">
                        {% csrf_token %}
                        <button class="btn btn-secondary" type="submit">Đăng xuất ({{ user.username }})</button>
                    </form>
                {% else %}
                    <a class="btn btn-outline-light me-2" href="{% url 'login' %}">Đăng nhập</a>
                    <a class="btn btn-primary" href="{% url 'signup' %}">Đăng ký</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container my-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-info">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
