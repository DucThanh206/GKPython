{% extends 'base.html' %}
{% block title %}Đăng tài liệu - EduHub{% endblock %}
{% block content %}
<h1 class="mb-4">Đăng tài liệu mới</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Đăng tài liệu</button>
</form>
{% endblock %}
