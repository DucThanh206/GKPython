{% extends 'base.html' %}
{% block title %}Đăng ký - EduHub{% endblock %}
{% block content %}
<h1 class="mb-4">Tạo tài khoản</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Đăng ký</button>
</form>
<p class="mt-3">Đã có tài khoản? <a href="{% url 'login' %}">Đăng nhập</a></p>
{% endblock %}
